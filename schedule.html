<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>配信予定｜らてらてちゃん応援ルーム</title>

  <link rel="stylesheet" href="style.css">

  <style>

    /* ========================================
       📅 スケジュールページ
    ======================================== */

    .schedule-section {
      background: linear-gradient(135deg, #2CB6F6, #6dd5fa);
      color: white;
      border-radius: 16px;
      padding: 25px 15px;
      margin: 25px auto;
      max-width: 900px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
    }

    .schedule-section h2 {
      color: #3D2B4F;
      text-shadow:
        0 0 5px rgba(255, 243, 176, 0.8),
        0 0 12px rgba(255, 243, 176, 0.45);

      border-bottom: 2px solid rgba(255,255,255,0.7);
      padding-bottom: 8px;
      display: inline-block;
      margin: 5px 0 20px;
      font-size: 22px;
    }


    /* ========================================
       TimeTreeを入れる白い枠
    ======================================== */

    .calendar-box {
      background: white;
      border-radius: 14px;
      padding: 10px;
      overflow: hidden;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
    }


    /* ========================================
       TimeTree
    ======================================== */

    .timetree-calendar {
      width: 100%;
      height: 700px;
      border: none;
      display: block;
      border-radius: 10px;
    }


    /* ========================================
       説明
    ======================================== */

    .schedule-note {
      margin: 0 auto 20px;
      max-width: 750px;
      line-height: 1.7;
      font-size: 14px;
    }


    /* ========================================
       スマホ
    ======================================== */

    @media (max-width: 768px) {

      .schedule-section {
        padding: 18px 8px;
      }

      .calendar-box {
        padding: 5px;
      }

      .timetree-calendar {
        height: 650px;
      }

    }

  </style>

</head>


<body>

  <div class="layout">


    <!-- ========================================
         左メニュー
    ======================================== -->

    <nav class="side-menu">

      <a href="index.html" class="menu-link">
        プロフィール
      </a>

      <a href="songs.html" class="menu-link">
        うた
      </a>

      <a href="videos.html" class="menu-link">
        最新動画
      </a>

      <a href="videos-list.html" class="menu-link">
        動画一覧
      </a>

      <a href="schedule.html" class="menu-link active">
        配信予定
      </a>

      <a href="fan.html" class="menu-link">
        ファンコーナー
      </a>

    </nav>


    <!-- ========================================
         メイン
    ======================================== -->

    <main class="main-content">

      <h1>
        ☕️らてらてちゃん応援ルーム🎧️
      </h1>


      <!-- ========================================
           📺 配信予定
      ======================================== -->

      <div class="schedule-section">

        <h2>
          📺 配信予定
        </h2>

        <p class="schedule-note">
          山下学園公式TimeTreeに登録されている
          配信予定を表示しています。
        </p>

        <div class="calendar-box">

          <iframe
            class="timetree-calendar"
            src="https://timetreeapp.com/public_calendars/ymstgakuen_streaming/embed/monthly?calendar_name=true"
            loading="lazy">
          </iframe>

        </div>

      </div>



      <!-- ========================================
           🎤 ライブ・イベント予定
      ======================================== -->

      <div class="schedule-section">

        <h2>
          🎤 ライブ・イベント予定
        </h2>

        <p class="schedule-note">
          山下学園公式TimeTreeに登録されている
          ライブ・イベント予定を表示しています。
        </p>

        <div class="calendar-box">

          <iframe
            class="timetree-calendar"
            src="https://timetreeapp.com/public_calendars/yamashita_gakuen/embed/monthly?calendar_name=true"
            loading="lazy">
          </iframe>

        </div>

      </div>


    </main>

  </div>

</body>

</html>
