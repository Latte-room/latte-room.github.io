name: Update Latte Schedule

on:
  workflow_dispatch:

  schedule:
    # 1時間ごとに自動更新
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install TimeTree Exporter
        run: |
          python -m pip install --upgrade pip
          pip install timetree-exporter==0.9.0

      - name: Export TimeTree calendars
        run: |
          timetree-exporter \
            --public-calendar \
            -c ymstgakuen_streaming \
            -o streaming.ics

          timetree-exporter \
            --public-calendar \
            -c yamashita_gakuen \
            -o live.ics

      - name: Create schedule history
        shell: bash
        run: |
          cat > filter_schedule.py <<'PY'
          import json
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          JST = ZoneInfo("Asia/Tokyo")


          # ========================================
          # ICSの折り返しを戻す
          # ========================================

          def unfold_ics(text):
              lines = (
                  text
                  .replace("\r\n", "\n")
                  .replace("\r", "\n")
                  .split("\n")
              )

              result = []

              for line in lines:
                  if (
                      (line.startswith(" ") or line.startswith("\t"))
                      and result
                  ):
                      result[-1] += line[1:]
                  else:
                      result.append(line)

              return result


          # ========================================
          # ICS文字列を読みやすくする
          # ========================================

          def unescape(value):
              return (
                  value
                  .replace("\\n", "\n")
                  .replace("\\N", "\n")
                  .replace("\\,", ",")
                  .replace("\\;", ";")
                  .replace("\\\\", "\\")
              )


          # ========================================
          # ICS読み込み
          # ========================================

          def parse_ics(path):
              text = Path(path).read_text(
                  encoding="utf-8"
              )

              lines = unfold_ics(text)

              events = []
              event = None

              for line in lines:

                  if line == "BEGIN:VEVENT":
                      event = {}
                      continue

                  if line == "END:VEVENT":

                      if event:
                          events.append(event)

                      event = None
                      continue

                  if event is None:
                      continue

                  if ":" not in line:
                      continue

                  left, value = line.split(
                      ":",
                      1
                  )

                  key = left.split(
                      ";",
                      1
                  )[0]

                  if key in {
                      "SUMMARY",
                      "DESCRIPTION",
                      "DTSTART",
                      "DTEND",
                      "LOCATION",
                      "URL",
                      "SOURCE",
                      "UID"
                  }:
                      event[key] = unescape(
                          value
                      )

              return events


          # ========================================
          # 日時変換
          # ========================================

          def parse_datetime(value):

              if not value:
                  return None

              # 終日予定
              if re.fullmatch(
                  r"\d{8}",
                  value
              ):
                  dt = datetime.strptime(
                      value,
                      "%Y%m%d"
                  )

                  return dt.replace(
                      tzinfo=JST
                  )

              # UTC
              if re.fullmatch(
                  r"\d{8}T\d{6}Z",
                  value
              ):
                  dt = datetime.strptime(
                      value,
                      "%Y%m%dT%H%M%SZ"
                  )

                  dt = dt.replace(
                      tzinfo=ZoneInfo("UTC")
                  )

                  return dt.astimezone(
                      JST
                  )

              # 日本時間
              if re.fullmatch(
                  r"\d{8}T\d{6}",
                  value
              ):
                  dt = datetime.strptime(
                      value,
                      "%Y%m%dT%H%M%S"
                  )

                  return dt.replace(
                      tzinfo=JST
                  )

              return None


          # ========================================
          # JSON形式に変換
          # ========================================

          def event_to_json(
              event,
              event_type
          ):

              start = parse_datetime(
                  event.get("DTSTART")
              )

              end = parse_datetime(
                  event.get("DTEND")
              )

              if not start:
                  return None

              return {
                  "type": event_type,

                  "title": event.get(
                      "SUMMARY",
                      ""
                  ).strip(),

                  "start": start.isoformat(),

                  "end": (
                      end.isoformat()
                      if end
                      else None
                  ),

                  "location": event.get(
                      "LOCATION",
                      ""
                  ).strip(),

                  "url": event.get(
                      "URL",
                      ""
                  ).strip(),

                  "source": event.get(
                      "SOURCE",
                      ""
                  ).strip(),

                  "description": event.get(
                      "DESCRIPTION",
                      ""
                  ).strip(),

                  "uid": event.get(
                      "UID",
                      ""
                  ).strip()
              }


          # ========================================
          # 現在時刻
          # ========================================

          now = datetime.now(JST)


          # ========================================
          # TimeTreeの最新データを取得
          # ========================================

          streaming_events = parse_ics(
              "streaming.ics"
          )

          live_events = parse_ics(
              "live.ics"
          )


          # ========================================
          # 今回取得した配信予定
          #
          # らてらてちゃんだけ
          # 過去も残す
          # ========================================

          latte_words = [
              "らてらて",
              "神宮寺らて"
          ]

          new_streaming = []

          for event in streaming_events:

              title = event.get(
                  "SUMMARY",
                  ""
              )

              description = event.get(
                  "DESCRIPTION",
                  ""
              )

              search_text = (
                  title
                  + "\n"
                  + description
              )

              if not any(
                  word in search_text
                  for word in latte_words
              ):
                  continue

              item = event_to_json(
                  event,
                  "streaming"
              )

              if item:
                  new_streaming.append(
                      item
                  )


          # ========================================
          # 今回取得したライブ・イベント
          #
          # 新入生関連だけ除外
          # 過去も残す
          # ========================================

          new_live = []

          for event in live_events:

              title = event.get(
                  "SUMMARY",
                  ""
              )

              description = event.get(
                  "DESCRIPTION",
                  ""
              )

              search_text = (
                  title
                  + "\n"
                  + description
              )

              # 新入生関連は保存しない
              if "新入生" in search_text:
                  continue

              item = event_to_json(
                  event,
                  "live"
              )

              if item:
                  new_live.append(
                      item
                  )


          # ========================================
          # 以前保存した履歴を読み込む
          # ========================================

          old_streaming = []
          old_live = []

          schedule_path = Path(
              "schedule-data.json"
          )

          if schedule_path.exists():

              try:

                  old_data = json.loads(
                      schedule_path.read_text(
                          encoding="utf-8"
                      )
                  )

                  old_streaming = (
                      old_data.get(
                          "streaming",
                          []
                      )
                  )

                  old_live = (
                      old_data.get(
                          "live",
                          []
                      )
                  )

              except Exception as error:

                  print(
                      "以前のJSONを読み込めませんでした:",
                      error
                  )


          # ========================================
          # UIDを使って履歴を統合
          #
          # 同じ予定は重複させない
          # 最新情報があれば上書き
          # ========================================

          def merge_events(
              old_events,
              new_events
          ):

              merged = {}


              # 以前保存した予定
              for event in old_events:

                  uid = event.get(
                      "uid",
                      ""
                  )

                  if uid:
                      merged[uid] = event


              # 今回取得した予定
              # 同じUIDなら最新情報で上書き
              for event in new_events:

                  uid = event.get(
                      "uid",
                      ""
                  )

                  if uid:
                      merged[uid] = event


              result = list(
                  merged.values()
              )

              result.sort(
                  key=lambda x:
                  x.get(
                      "start",
                      ""
                  )
              )

              return result


          all_streaming = merge_events(
              old_streaming,
              new_streaming
          )

          all_live = merge_events(
              old_live,
              new_live
          )


          # ========================================
          # 念のため、過去に保存された
          # 新入生関連も履歴から除外
          # ========================================

          cleaned_live = []

          for event in all_live:

              search_text = (
                  event.get(
                      "title",
                      ""
                  )
                  + "\n"
                  + event.get(
                      "description",
                      ""
                  )
              )

              if "新入生" in search_text:
                  continue

              cleaned_live.append(
                  event
              )

          all_live = cleaned_live


          # ========================================
          # JSON出力
          # ========================================

          output = {
              "updatedAt": now.isoformat(),
              "streaming": all_streaming,
              "live": all_live
          }


          schedule_path.write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )


          # ========================================
          # Actionsログ
          # ========================================

          print("")
          print(
              "=============================="
          )

          print(
              "  らてらてちゃん予定・履歴"
          )

          print(
              "=============================="
          )

          print("")


          print(
              "配信予定・履歴:",
              len(all_streaming),
              "件"
          )

          for event in all_streaming:

              print(
                  event.get(
                      "start",
                      ""
                  ),
                  event.get(
                      "title",
                      ""
                  )
              )


          print("")


          print(
              "ライブ・イベント履歴:",
              len(all_live),
              "件"
          )

          for event in all_live:

              print(
                  event.get(
                      "start",
                      ""
                  ),
                  event.get(
                      "title",
                      ""
                  )
              )


          print("")

          print(
              "schedule-data.json を更新しました"
          )
          PY

          python filter_schedule.py

      - name: Show schedule data
        run: |
          echo "===== schedule-data.json ====="
          cat schedule-data.json

      - name: Commit schedule data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schedule-data.json

          if git diff --cached --quiet; then
            echo "予定に変更はありません"
          else
            git commit -m "Update Latte schedule history"
            git push
          fi
