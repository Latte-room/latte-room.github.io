name: Update Latte Schedule

on:
  workflow_dispatch:

  schedule:
    # 1時間ごとに自動更新
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  update-schedule:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install TimeTree Exporter
        run: |
          python -m pip install --upgrade pip
          pip install timetree-exporter==0.9.0

      - name: Export TimeTree calendars
        run: |
          timetree-exporter \
            --public-calendar \
            -c ymstgakuen_streaming \
            -o streaming.ics

          timetree-exporter \
            --public-calendar \
            -c yamashita_gakuen \
            -o live.ics

      - name: Create filtered schedule
        shell: bash
        run: |
          cat > filter_schedule.py <<'PY'
          import json
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          JST = ZoneInfo("Asia/Tokyo")


          def unfold_ics(text):
              lines = (
                  text
                  .replace("\r\n", "\n")
                  .replace("\r", "\n")
                  .split("\n")
              )

              result = []

              for line in lines:
                  if (
                      (line.startswith(" ") or line.startswith("\t"))
                      and result
                  ):
                      result[-1] += line[1:]
                  else:
                      result.append(line)

              return result


          def unescape(value):
              return (
                  value
                  .replace("\\n", "\n")
                  .replace("\\N", "\n")
                  .replace("\\,", ",")
                  .replace("\\;", ";")
                  .replace("\\\\", "\\")
              )


          def parse_ics(path):
              text = Path(path).read_text(encoding="utf-8")
              lines = unfold_ics(text)

              events = []
              event = None

              for line in lines:

                  if line == "BEGIN:VEVENT":
                      event = {}
                      continue

                  if line == "END:VEVENT":
                      if event:
                          events.append(event)

                      event = None
                      continue

                  if event is None:
                      continue

                  if ":" not in line:
                      continue

                  left, value = line.split(":", 1)
                  key = left.split(";", 1)[0]

                  if key in {
                      "SUMMARY",
                      "DESCRIPTION",
                      "DTSTART",
                      "DTEND",
                      "LOCATION",
                      "URL",
                      "SOURCE",
                      "UID"
                  }:
                      event[key] = unescape(value)

              return events


          def parse_datetime(value):
              if not value:
                  return None

              # 終日予定
              if re.fullmatch(r"\d{8}", value):
                  dt = datetime.strptime(value, "%Y%m%d")
                  return dt.replace(tzinfo=JST)

              # UTC
              if re.fullmatch(r"\d{8}T\d{6}Z", value):
                  dt = datetime.strptime(
                      value,
                      "%Y%m%dT%H%M%SZ"
                  )

                  dt = dt.replace(
                      tzinfo=ZoneInfo("UTC")
                  )

                  return dt.astimezone(JST)

              # 日本時間
              if re.fullmatch(r"\d{8}T\d{6}", value):
                  dt = datetime.strptime(
                      value,
                      "%Y%m%dT%H%M%S"
                  )

                  return dt.replace(
                      tzinfo=JST
                  )

              return None


          def event_to_json(event, event_type):

              start = parse_datetime(
                  event.get("DTSTART")
              )

              end = parse_datetime(
                  event.get("DTEND")
              )

              if not start:
                  return None

              return {
                  "type": event_type,
                  "title": event.get(
                      "SUMMARY",
                      ""
                  ).strip(),

                  "start": start.isoformat(),

                  "end": (
                      end.isoformat()
                      if end
                      else None
                  ),

                  "location": event.get(
                      "LOCATION",
                      ""
                  ).strip(),

                  "url": event.get(
                      "URL",
                      ""
                  ).strip(),

                  "source": event.get(
                      "SOURCE",
                      ""
                  ).strip(),

                  "description": event.get(
                      "DESCRIPTION",
                      ""
                  ).strip(),

                  "uid": event.get(
                      "UID",
                      ""
                  ).strip()
              }


          # ==========================
          # 現在時刻
          # ==========================

          now = datetime.now(JST)


          # ==========================
          # TimeTree読み込み
          # ==========================

          streaming_events = parse_ics(
              "streaming.ics"
          )

          live_events = parse_ics(
              "live.ics"
          )


          # ==========================
          # 配信予定
          #
          # らてらてちゃんだけ
          # ＋終了済みを除外
          # ==========================

          latte_words = [
              "らてらて",
              "神宮寺らて"
          ]

          filtered_streaming = []

          for event in streaming_events:

              title = event.get(
                  "SUMMARY",
                  ""
              )

              description = event.get(
                  "DESCRIPTION",
                  ""
              )

              search_text = (
                  title
                  + "\n"
                  + description
              )

              # らてらてちゃん以外は除外
              if not any(
                  word in search_text
                  for word in latte_words
              ):
                  continue

              item = event_to_json(
                  event,
                  "streaming"
              )

              if not item:
                  continue

              start = datetime.fromisoformat(
                  item["start"]
              )

              end = (
                  datetime.fromisoformat(
                      item["end"]
                  )
                  if item["end"]
                  else start
              )

              # 終了済みは除外
              if end < now:
                  continue

              filtered_streaming.append(
                  item
              )


          # ==========================
          # ライブ・イベント
          #
          # 「新入生」を含む予定を除外
          # ＋終了済みを除外
          # ==========================

          filtered_live = []

          for event in live_events:

              title = event.get(
                  "SUMMARY",
                  ""
              )

              description = event.get(
                  "DESCRIPTION",
                  ""
              )

              search_text = (
                  title
                  + "\n"
                  + description
              )

              # 新入生関連を除外
              if "新入生" in search_text:
                  continue

              item = event_to_json(
                  event,
                  "live"
              )

              if not item:
                  continue

              start = datetime.fromisoformat(
                  item["start"]
              )

              end = (
                  datetime.fromisoformat(
                      item["end"]
                  )
                  if item["end"]
                  else start
              )

              # 終了済みは除外
              if end < now:
                  continue

              filtered_live.append(
                  item
              )


          # ==========================
          # 日時順
          # ==========================

          filtered_streaming.sort(
              key=lambda x: x["start"]
          )

          filtered_live.sort(
              key=lambda x: x["start"]
          )


          # ==========================
          # JSON出力
          # ==========================

          output = {
              "updatedAt": now.isoformat(),
              "streaming": filtered_streaming,
              "live": filtered_live
          }


          Path(
              "schedule-data.json"
          ).write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )


          # ==========================
          # Actionsログ
          # ==========================

          print("")
          print("==============================")
          print("  らてらてちゃん予定")
          print("==============================")
          print("")

          print(
              "配信予定:",
              len(filtered_streaming),
              "件"
          )

          for event in filtered_streaming:
              print(
                  event["start"],
                  event["title"]
              )

          print("")

          print(
              "ライブ・イベント:",
              len(filtered_live),
              "件"
          )

          for event in filtered_live:
              print(
                  event["start"],
                  event["title"]
              )

          print("")
          print(
              "schedule-data.json を更新しました"
          )
          PY

          python filter_schedule.py

      - name: Show schedule data
        run: |
          echo "===== schedule-data.json ====="
          cat schedule-data.json

      - name: Commit schedule data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add schedule-data.json

          if git diff --cached --quiet; then
            echo "予定に変更はありません"
          else
            git commit -m "Update Latte schedule"
            git push
          fi
