name: TimeTree Test

on:
  workflow_dispatch:

jobs:
  test-timetree:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install TimeTree Exporter
        run: |
          python -m pip install --upgrade pip
          pip install timetree-exporter

      - name: Export streaming calendar
        run: |
          timetree-exporter \
            --public-calendar \
            -c ymstgakuen_streaming \
            -o streaming.ics

      - name: Export live calendar
        run: |
          timetree-exporter \
            --public-calendar \
            -c yamashita_gakuen \
            -o live.ics

      - name: Show exported files
        run: |
          echo "===== STREAMING ====="
          head -n 50 streaming.ics

          echo ""
          echo "===== LIVE ====="
          head -n 50 live.ics

      - name: Upload test files
        uses: actions/upload-artifact@v4
        with:
          name: timetree-test
          path: |
            streaming.ics
            live.ics
