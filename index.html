  <link rel="stylesheet" href="style.css">

  <style>
    .schedule-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 10px;
    }

    .schedule-item {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 14px;
      padding: 18px 20px;
      box-shadow: 0 4px 12px rgba(0,0,0,.12);
      text-align: left;
      color: #333;
    }

    .schedule-date {
      font-weight: bold;
      font-size: 1.05em;
      color: #5b3b70;
      margin-bottom: 8px;
    }

    .schedule-time {
      font-weight: bold;
      font-size: 1.15em;
      color: #333;
      margin-bottom: 6px;
    }

    .schedule-title {
      font-size: 1em;
      color: #444;
      white-space: pre-wrap;
    }

    .schedule-location {
      margin-top: 6px;
      font-size: 0.9em;
      color: #777;
    }

    .no-schedule,
    .loading,
    .error-message {
      text-align: center;
      background: rgba(255,255,255,.95);
      padding: 24px 18px;
      border-radius: 14px;
      color: #555;
    }

    .error-message {
      color: #b00020;
      line-height: 1.7;
    }

    .updated-time {
      text-align: right;
      color: rgba(255,255,255,.95);
      font-size: 0.85em;
      margin-top: 12px;
    }
  </style>
</head>
