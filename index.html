<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>☕️らてらてちゃん応援ルーム🎧️</title>
    
    <style>
      /* ⭕️ バック全体をあなたのお気に入りの水色（#2CB6F6）にしました！ */
        body { background-color: #fcf9cf; color: #4a3e3d; text-align: center; font-family: sans-serif; padding: 20px; }
        
        /* ⭕️ 注意書きの枠を「白」に戻しました */
        .caution { background-color: #ffffff; border: 2px solid #d0b8ac; padding: 15px; margin: 0 auto 30px auto; max-width: 600px; display: block; border-radius: 5px; color: #4a3e3d; }
        
        /* ⭕️ 動画の枠を「白」にし、中の文字を読みやすい紺色に調整しました */
        .video-section { background-color: #2CB6F6; color: #ffffff; border-radius: 10px; padding: 20px; margin: 20px auto; max-width: 600px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .video-container { position: relative; width: 100%; padding-top: 56.25%; margin-top: 15px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; border-radius: 5px; }
        
        /* ショート動画を縦長に綺麗に見せるための設定 */
        .shorts-container { position: relative; width: 100%; max-width: 400px; padding-top: 140%; margin: 15px auto 0 auto; }
        .shorts-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; border-radius: 5px; }

        /* ボタンを綺麗なブルーにして、白ボックスの中で映えるようにしました */
        .btn { display: inline-block; padding: 10px 20px; background-color: #0288d1; color: white; text-decoration: none; border-radius: 5px; margin: 10px; font-weight: bold; }
        .btn:hover { background-color: #01579b; } 
        
        /* 見出しの下線を綺麗な水色にして、白ボックスのアクセントにしました */
        h2 { border-bottom: 2px solid #b3e5fc; padding-bottom: 5px; display: inline-block; margin-top: 10px; color: #0277bd; }
    </style>
</head>
<body>

    <h1>☕️らてらてちゃん応援ルーム🎧️</h1>

    <!-- 1. 非公式の注意書き -->
    <div class="caution">
        <strong>【ご注意】</strong><br>
        当サイトはファン個人が運営する非公式の応援サイトです。<br>
        山下学園、らてらてちゃんご本人、および関係者様とは一切関係ありません。
    </div>

    <!-- 2. 最新動画のエリア（横動画用） -->
    <div class="video-section">
        <h2>✨ 最新の横動画 ✨</h2>
       <div class="video-container" id="latest-video"></div>
    </div>

    <!-- 最新のショート動画のエリア -->
    <div class="video-section">
        <h2>✨ 最新のショート動画 ✨</h2>
       <div class="shorts-container" id="latest-shorts"></div>
    </div>

    <!-- 3. 今までの動画・プレイリストのエリア -->
    <div class="video-section">
        <h2>🎤 今までの動画・プレイリスト 🎤</h2>
        <p>山下学園おんがく部や、これまでの素敵な歌ってみたのまとめです！</p>
        <div class="video-container">
            <!-- 仮でおんがく部の別の人気動画を入れています -->
        </div>
    </div>

    <!-- 4. 公式リンク集 -->
    <div class="video-section">
        <h2>🔗 公式リンク集</h2>
        <p>最新情報や限定コンテンツは公式をチェック！</p>
        <a href="https://bitfan.id" class="btn" target="_blank">公式ファンクラブ（Bitfan）</a>
        <a href="https://youtube.com" class="btn" target="_blank">公式YouTube</a>
    </div>
    
<script src="script.js"></script>
   
</body>
</html>
